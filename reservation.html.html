<!-- ==================== TABLE RESERVATION VIEW ==================== -->
<div id="view-reservation" class="tab-view hidden">
  <section class="py-14 sm:py-20 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-2xl mx-auto mb-12">
      <span class="text-terracotta text-xs uppercase tracking-widest font-semibold">Reserve Your Spot</span>
      <h2 class="font-serif text-3xl sm:text-4xl font-bold text-forest dark:text-emerald-400 mt-1">Book a Table at Chiya Mantra</h2>
      <p class="text-gray-600 dark:text-gray-400 text-sm sm:text-base mt-2">Reservation Timings: <strong class="text-terracotta font-semibold">10:00 AM – 8:00 PM</strong>. Enjoy our cozy sitting space for family &amp; friends, board games (UNO, Jenga Block, Ludo), and fresh meals.</p>
    </div>

    <div class="bg-white dark:bg-dark-card p-8 sm:p-10 rounded-3xl shadow-sm border border-cream-surface dark:border-dark-border transition-colors duration-300">
      <form action="https://formsubmit.co/info.chiyamantra@gmail.com" method="POST" class="space-y-6">
        <input type="hidden" name="_subject" value="New Table Reservation - Chiya Mantra">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-charcoal/70 dark:text-gray-300 mb-1">Full Name *</label>
            <input type="text" name="Full Name" required placeholder="Birat Thapa" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-dark-border dark:bg-dark-bg dark:text-gray-100 focus:ring-2 focus:ring-terracotta outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-charcoal/70 dark:text-gray-300 mb-1">Contact Number / WhatsApp *</label>
            <input type="tel" name="Contact Number" required placeholder="+977-98XXXXXXXX" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-dark-border dark:bg-dark-bg dark:text-gray-100 focus:ring-2 focus:ring-terracotta outline-none text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-charcoal/70 dark:text-gray-300 mb-1">Reservation Date *</label>
            <input type="date" name="Date" required class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-dark-border dark:bg-dark-bg dark:text-gray-100 focus:ring-2 focus:ring-terracotta outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-charcoal/70 dark:text-gray-300 mb-1">Time Slot (10AM - 8PM) *</label>
            <input type="time" name="Time" min="10:00" max="20:00" required class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-dark-border dark:bg-dark-bg dark:text-gray-100 focus:ring-2 focus:ring-terracotta outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-charcoal/70 dark:text-gray-300 mb-1">No. of Guests *</label>
            <select name="Guests" required class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-dark-border dark:bg-dark-bg dark:text-gray-100 focus:ring-2 focus:ring-terracotta outline-none text-sm">
              <option value="1-2 Guests">1-2 Guests</option>
              <option value="3-4 Guests">3-4 Guests</option>
              <option value="5-8 Guests">5-8 Guests (Family / Friends)</option>
              <option value="9+ Gathering">9+ Large Gathering</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-charcoal/70 dark:text-gray-300 mb-1">Special Requests (Optional)</label>
          <textarea name="Special Requests" rows="3" placeholder="Seating preferences, Cloud Hookah setup, board games reservation (UNO, Jenga, Ludo), food preferences..." class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-dark-border dark:bg-dark-bg dark:text-gray-100 focus:ring-2 focus:ring-terracotta outline-none text-sm"></textarea>
        </div>

        <button type="submit" class="w-full py-3.5 bg-forest dark:bg-emerald-700 hover:bg-forest-dark dark:hover:bg-emerald-800 text-white font-semibold rounded-xl transition-all shadow-md">
          Confirm Table Reservation (10 AM - 8 PM)
        </button>
      </form>
    </div>
  </section>
</div>
